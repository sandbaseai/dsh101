name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 244d49f84a987ecfa2cf9480ed9d8628
      CLOUDFLARE_CUSTOM_DOMAIN: dsh101.sandbase.ai
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check content
        run: npm run check

      - name: Build static site
        run: npm run build

      - name: Ensure Cloudflare Pages project exists
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          project_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/dsh101"
          status="$(curl --silent --show-error --output /tmp/dsh101-project.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${project_url}")"

          if [[ "${status}" == "200" ]]; then
            echo "Cloudflare Pages project dsh101 already exists."
          elif jq --exit-status '.errors[]? | select(.code == 8000007)' /tmp/dsh101-project.json >/dev/null; then
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data '{"name":"dsh101","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              | jq --exit-status '.success == true' >/dev/null
            echo "Created Cloudflare Pages project dsh101."
          else
            jq '{success, errors, messages}' /tmp/dsh101-project.json
            exit 1
          fi

      - name: Ensure custom domain is attached
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          domains_url="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/dsh101/domains"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${domains_url}" > /tmp/dsh101-domains.json

          if jq --exit-status --arg name "${CLOUDFLARE_CUSTOM_DOMAIN}" \
            '.result[]? | select(.name == $name)' /tmp/dsh101-domains.json >/dev/null; then
            echo "Custom domain ${CLOUDFLARE_CUSTOM_DOMAIN} is already attached."
          else
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --header 'Content-Type: application/json' \
              --data "{\"name\":\"${CLOUDFLARE_CUSTOM_DOMAIN}\"}" \
              "${domains_url}" \
              | jq --exit-status '.success == true' >/dev/null
            echo "Attached custom domain ${CLOUDFLARE_CUSTOM_DOMAIN}."
          fi

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${domains_url}" \
            | jq --exit-status --arg name "${CLOUDFLARE_CUSTOM_DOMAIN}" \
              -r '.result[] | select(.name == $name) | "Custom domain status: \(.status)"'

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=dsh101 --branch=main

      - name: Report missing Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not available to this repository; build verified but deployment was skipped."
